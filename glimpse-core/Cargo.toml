[package]
name = "glimpse-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["media", "weather", "printing", "heic"]
dev = []
media = ["dep:pipewire"]
weather = ["dep:reqwest"]
printing = ["dep:ipp"]
heic = ["dep:libheif-rs"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
futures-util.workspace = true
image = "0.25"
ipp = { version = "6", default-features = false, features = ["async-client-rustls"], optional = true }
libheif-rs = { version = "2.7.0", optional = true }
notify.workspace = true
notify-debouncer-full.workspace = true
pipewire = { version = "0.9", optional = true }
reqwest = { workspace = true, optional = true }
regex.workspace = true
rrule.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sunrise.workspace = true
system-tray.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
wl-clipboard-rs.workspace = true
zbus = { workspace = true, features = ["blocking-api"] }
