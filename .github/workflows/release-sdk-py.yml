name: Release Python SDK

on:
  push:
    tags:
      - 'sdk-py-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/sdk-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: sdk/sdk-py/pyproject.toml
      - name: Verify tag matches pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' pyproject.toml)"
          tag="${TAG#sdk-py-v}"
          test "$version" = "$tag"
      - run: python -m pip install --upgrade pip build
      - run: pip install .
      - run: python -m unittest discover -s tests
      - run: python -m build
      - name: Publish (skips if version already on PyPI; trusted publishing via OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/sdk-py/dist/
          skip-existing: true
