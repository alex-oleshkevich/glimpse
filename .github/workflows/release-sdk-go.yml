name: Release Go SDK

on:
  push:
    tags:
      - "sdk/sdk-go/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing module tag to release (sdk/sdk-go/vX.Y.Z)"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: sdk/sdk-go
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#sdk/sdk-go/}"
          notes_file="$(mktemp)"
          {
            printf 'Go module: `github.com/alex-oleshkevich/glimpse/sdk/sdk-go` at `%s`.\n\n' "$version"
            printf 'Install: `go get github.com/alex-oleshkevich/glimpse/sdk/sdk-go@%s`\n' "$version"
          } > "$notes_file"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Go SDK $version" --notes-file "$notes_file"
          else
            gh release create "$TAG" --verify-tag --title "Go SDK $version" --notes-file "$notes_file"
          fi
