name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - flake.nix
      - flake.lock
      - nix/**
      - data/**
      - crates/glimpse-package/**
      - scripts/package-*.sh
      - scripts/render-pkgbuild.sh
      - scripts/test-*-docker.sh
      - PKGBUILD
      - install.sh
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to dry-run against (vX.Y.Z) — the workflow still needs an existing tag to verify against"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_DEPS: >-
    libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev libheif-dev
    libpam0g-dev libglib2.0-dev libclang-dev libpulse-dev libpipewire-0.3-dev
    libudev-dev libsystemd-dev pkg-config

jobs:
  verify:
    name: resolve candidate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
      ref: ${{ steps.resolve-tag.outputs.ref }}
    steps:
      - id: resolve-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${INPUT_TAG:-$REF_TAG}" >> "$GITHUB_OUTPUT"
            echo "ref=${INPUT_TAG:-$REF_TAG}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve-tag.outputs.ref }}
      - uses: extractions/setup-just@v4
      - if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: just release-verify "$TAG"

  test:
    name: test
    needs: verify
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $BUILD_DEPS desktop-file-utils gettext ripgrep python3-venv python3-gi python3-dbus
      - name: Install blueprint-compiler
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/blueprint-compiler"
          "$RUNNER_TEMP/blueprint-compiler/bin/pip" install blueprint-compiler==0.22.2
          echo "$RUNNER_TEMP/blueprint-compiler/bin" >> "$GITHUB_PATH"
      - run: just verify

  nixos-integration:
    name: NixOS Docker integration
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}
      - name: Free disk for the Nix store
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash scripts/test-nix-docker.sh

  package:
    name: package
    needs: [test, verify]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $BUILD_DEPS blueprint-compiler gettext zstd
      - id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: packaging-tools-cargo-deb-3.7.0
      - name: Install cargo-deb
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: cargo install cargo-deb --version 3.7.0 --locked
      - name: Build packages
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          just package-binary "${TAG#v}"
          just package-deb
      - name: Collect packages
        run: |
          cp target/debian/*.deb dist/
          tarballs=(dist/glimpse-*-x86_64.tar.zst)
          version="${tarballs[0]#dist/glimpse-}"
          version="${version%-x86_64.tar.zst}"
          scripts/render-pkgbuild.sh --local "$version" > dist/PKGBUILD
      - uses: actions/upload-artifact@v4
        with:
          name: packages-ubuntu
          path: |
            dist/*.tar.zst
            dist/*.deb
            dist/*.b2
            dist/*.sha256
            dist/PKGBUILD
          retention-days: 1

  rpm-fedora:
    name: build Fedora RPM
    needs: [test, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}
      - run: |
          docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src" -w /src \
            fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 \
            bash -lc 'dnf install -y rust cargo just gcc rpm-build pkgconf-pkg-config gtk4-devel libadwaita-devel gtk4-layer-shell-devel libheif-devel pam-devel pulseaudio-libs-devel pipewire-devel systemd-devel libudev-devel clang-devel blueprint-compiler gettext zstd curl patch && CARGO_BUILD_JOBS=2 just package-rpm-fedora && mkdir -p dist && cp target/generate-rpm/*.rpm dist/'
      - uses: actions/upload-artifact@v4
        with:
          name: packages-fedora
          path: dist/*.rpm
          retention-days: 1

  rpm-opensuse:
    name: build openSUSE RPM
    needs: [test, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}
      - run: |
          docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src" -w /src \
            opensuse/tumbleweed@sha256:007fde2c1e6b3de48681c765b3d6905d4e59d2f7a26f4585ec49dd11305c3fe7 \
            bash -lc 'zypper --non-interactive install --no-recommends rust cargo just gcc rpm-build gawk make pkgconf-pkg-config gtk4-devel libadwaita-devel gtk4-layer-shell-devel libheif-devel pam-devel libpulse-devel pipewire-devel systemd-devel libudev-devel clang-devel blueprint-compiler gettext-tools zstd curl patch && CARGO_BUILD_JOBS=2 just package-rpm-opensuse && mkdir -p dist && cp target/generate-rpm/*.rpm dist/'
      - uses: actions/upload-artifact@v4
        with:
          name: packages-opensuse
          path: dist/*.rpm
          retention-days: 1

  collect:
    name: collect candidate artifacts
    needs: [package, rpm-fedora, rpm-opensuse]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist/
          merge-multiple: true
      - run: ( cd dist && sha256sum -- *.tar.zst *.deb *.rpm > SHA256SUMS )
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          retention-days: 1

  distro-integration:
    name: Distro Docker integration
    needs: [verify, collect]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/
      - run: bash scripts/test-distros-docker.sh

  publish:
    name: publish GitHub Release
    if: github.event_name == 'push'
    needs: [verify, collect, nixos-integration, distro-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          existing="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          case "$existing" in
            true) gh release upload "$TAG" dist/*.tar.zst dist/*.deb dist/*.rpm dist/SHA256SUMS --clobber ;;
            false) printf 'release %s is already published\n' "$TAG" >&2; exit 1 ;;
            *) gh release create "$TAG" dist/*.tar.zst dist/*.deb dist/*.rpm dist/SHA256SUMS \
                 --verify-tag --title "$TAG" --generate-notes --draft ;;
          esac
          mkdir published
          gh release download "$TAG" --dir published
          for file in dist/*.tar.zst dist/*.deb dist/*.rpm dist/SHA256SUMS; do
            cmp "$file" "published/$(basename "$file")"
          done
          ( cd published && sha256sum -c SHA256SUMS )
          gh release edit "$TAG" --draft=false

  publish-aur:
    name: publish AUR package
    if: github.event_name == 'push'
    needs: [verify, collect, publish]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/
      - name: Check AUR_SSH_PRIVATE_KEY
        id: aur-key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY not configured, skipping AUR publish"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Render PKGBUILD and .SRCINFO
        if: steps.aur-key.outputs.configured == 'true'
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          pacman -Sy --noconfirm --needed just openssh git
          version="${TAG#v}"
          b2sum="$(cut -d' ' -f1 "dist/glimpse-${version}-x86_64.tar.zst.b2")"
          just release-pkgbuild "$version" "$b2sum"
          useradd -m builder
          chown -R builder:builder dist/
          su builder -c 'cd dist && makepkg -p PKGBUILD --printsrcinfo > .SRCINFO'
      - name: Push to AUR
        if: steps.aur-key.outputs.configured == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p "$HOME/.ssh"
          echo "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keyscan -H aur.archlinux.org > "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git clone ssh://aur@aur.archlinux.org/glimpse-desktop-bin.git aur-repo
          cp dist/PKGBUILD dist/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "glimpse release bot"
          git config user.email "alex.oleshkevich@gmail.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::AUR package unchanged, nothing to push"
          else
            git commit -m "update to $TAG"
            git push
          fi
