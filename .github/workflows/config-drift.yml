name: Config defaults

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  config-drift:
    name: the generated config references match the Config types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      - name: Regenerate and check the three generated config references
        run: |
          just gen-config-default
          just gen-config-schema
          just gen-config-commented
          if ! git diff --exit-code -- data/config.default.toml data/config.schema.json data/config.commented.toml; then
            echo "::error::stale generated config file — run 'just gen-config-default', 'just gen-config-schema' and 'just gen-config-commented' and commit the result"
            exit 1
          fi
