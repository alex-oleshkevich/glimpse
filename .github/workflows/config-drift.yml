name: Config defaults

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  config-drift:
    name: data/config.default.toml and config.schema.json match the Config types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      - name: Regenerate and check data/config.default.toml and data/config.schema.json
        run: |
          just gen-config-default
          just gen-config-schema
          if ! git diff --exit-code -- data/config.default.toml data/config.schema.json; then
            echo "::error::stale generated config file — run 'just gen-config-default' and 'just gen-config-schema' and commit the result"
            exit 1
          fi
