name: Config defaults

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  config-drift:
    name: the generated config references match the Config types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      - name: Regenerate and check the six generated config references
        run: |
          for doc in config panel; do
            just gen-config-default "$doc"
            just gen-config-schema "$doc"
            just gen-config-commented "$doc"
          done
          if ! git diff --exit-code -- data/config.* data/panel.*; then
            echo "::error::stale generated config file — run 'just gen-config-default|schema|commented config|panel' and commit the result"
            exit 1
          fi
