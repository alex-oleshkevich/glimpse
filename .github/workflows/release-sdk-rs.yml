name: Release Rust SDK

on:
  push:
    tags:
      - 'sdk-rs-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/sdk-rs
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo.toml version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag="${TAG#sdk-rs-v}"
          test "$version" = "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already published
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="glimpse-sdk"
          if curl -fsSL -A "glimpse-sdk-release/1.0" "https://crates.io/api/v1/crates/$name/$VERSION" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$VERSION already on crates.io; skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.already == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.check.outputs.already == 'false'
        run: cargo test
      - if: steps.check.outputs.already == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
