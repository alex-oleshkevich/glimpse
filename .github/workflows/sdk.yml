name: SDK CI

on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'scripts/sdk-e2e.py'
      - '.github/workflows/sdk.yml'
  push:
    branches:
      - master
      - main
    paths:
      - 'sdk/**'
      - 'scripts/sdk-e2e.py'
      - '.github/workflows/sdk.yml'

permissions:
  contents: read

jobs:
  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/sdk-rs
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            sdk/sdk-rs/target
          key: ${{ runner.os }}-sdk-rs-${{ hashFiles('sdk/sdk-rs/Cargo.toml') }}
      - run: cargo test
      - run: cargo build --release
      - run: cargo package --no-verify --allow-dirty

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/sdk-py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: sdk/sdk-py/pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m build

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/sdk-ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: sdk/sdk-ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/sdk-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  e2e:
    name: SDK E2E protocol contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            sdk/sdk-rs/target
          key: ${{ runner.os }}-sdk-e2e-rs-${{ hashFiles('sdk/sdk-rs/Cargo.toml') }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: sdk/sdk-ts/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - name: Run protocol contract test against all SDKs
        run: python3 scripts/sdk-e2e.py
