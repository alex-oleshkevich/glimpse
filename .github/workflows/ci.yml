name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      CARGO_INCREMENTAL: "1"
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            blueprint-compiler \
            cargo \
            clang \
            git \
            gtk4 \
            gtk4-layer-shell \
            libadwaita \
            libheif \
            pam \
            pkgconf

      - name: Check out source
        uses: actions/checkout@v5

      - name: Restore Cargo dependency cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-arch-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arch-cargo-

      - name: Restore Cargo build cache
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-arch-target-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-arch-target-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-arch-target-

      - name: Verify lockfile
        run: cargo fetch --locked

      - name: Test core and application crates
        run: |
          cargo test --locked \
            -p glimpse-core \
            -p glimpse-lock \
            -p glimpse-shell \
            -p glimpse-wallpaper

      - name: Check applications
        run: |
          cargo check --locked \
            -p glimpse-lock \
            -p glimpse-shell \
            -p glimpse-wallpaper

      - name: Build release binaries
        run: |
          cargo build --release --locked \
            -p glimpse-lock \
            -p glimpse-shell \
            -p glimpse-wallpaper
