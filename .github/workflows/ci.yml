name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: just verify
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev libheif-dev \
            libpam0g-dev libglib2.0-dev libclang-dev libpulse-dev libpipewire-0.3-dev libudev-dev \
            libsystemd-dev pkg-config desktop-file-utils gettext python3-venv python3-gi python3-dbus
      - name: Install blueprint-compiler
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/blueprint-compiler"
          "$RUNNER_TEMP/blueprint-compiler/bin/pip" install blueprint-compiler==0.22.2
          echo "$RUNNER_TEMP/blueprint-compiler/bin" >> "$GITHUB_PATH"
      - run: just verify
