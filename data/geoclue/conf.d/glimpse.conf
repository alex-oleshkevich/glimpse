# allowed=true stops GeoClue asking an agent to authorize us. glimpsed is a session daemon with no
# desktop file and nobody sitting in front of it, so an agent means either a refusal or a prompt
# that goes unanswered.
#
# The section name must match DESKTOP_ID in crates/glimpse-services/src/services/geolocation.rs.
# An empty users= means every user.

[glimpse]
allowed=true
system=true
users=
