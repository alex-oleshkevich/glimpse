#:schema /usr/share/glimpse/config.schema.json
# Every config.toml setting at its default, commented out. Uncomment a line, and its [table] line, to change it.
# /usr/share/glimpse/config.default.toml holds the same settings uncommented; the schema lists them all.

[appearance]
# theme = "adwaita"
# theme-variant = ""
# color-scheme = "dark"
# desktop-color-scheme = "sun"
# blur = false
# animation-speed = 1.0

# [geolocation]
# provider = "geoclue"

[bluetooth]
# scan-timeout = 30
# hide-unnamed = true

[network]
# scan-timeout = 30
# hide-unnamed = true

[night-light]
# schedule = "automatic"
# temperature = 4200
# transition-minutes = 15

[brightness]
# minimum = 3
# ddc = true

[idle]
# enabled = true
# respect-inhibitors = true

# [[idle.profiles.ac.listeners]]
# timeout = 900
# on-idle = "glimpse-dpms off"
# on-resume = "glimpse-dpms on"

# [[idle.profiles.ac.listeners]]
# timeout = 1800
# on-idle = "loginctl lock-session"
# on-resume = ""

# [[idle.profiles.ac.listeners]]
# timeout = 3600
# on-idle = "systemctl suspend"
# on-resume = ""

# [[idle.profiles.battery.listeners]]
# timeout = 900
# on-idle = "glimpse-dpms off"
# on-resume = "glimpse-dpms on"

# [[idle.profiles.battery.listeners]]
# timeout = 1800
# on-idle = "systemctl suspend"
# on-resume = ""

[keyboard]
# remember = "window"

[keyboard.labels]

[calendar]
# poll-interval = 600
# sources = []

[clipboard]
# enabled = true
# limit = 100
# max-entry-kib = 2048
# max-total-kib = 10240
# capture-images = true

[screenshot]
# filename = "Screenshot from %Y-%m-%d %H-%M-%S.png"
# editor = "overlay"
# delay = 0
# flash = true
# cursor = false
# notify = true
# color = "red"
# stroke = "medium"

[weather]
# provider = "open-meteo"
# poll-interval = 900
# forecast-days = 7

[mpris]
# ignore = []
# fetch-art = true
# art-max-kib = 4096

[notifications]
# keep = 100
# suppress = []
# enabled = true
# edge = "top-right"
# hide-delay = 4
# max-items = 6

[wallpaper]
# color = "#000000"
# image = "/usr/share/glimpse/themes/adwaita/default.jpg"
# fit = "cover"
# transition = "fade"
# transition-ms = 500
# outputs = []

[wallpaper.backdrop]
# enabled = true
# blur-radius = 24
# downscale-factor = 4

[lock]
# prompt-output = "focused"

[lock.background]
# color = "#000000"
# fit = "cover"
# blur-radius = 0
# dim = 0.35
# dim-dark = 0.5

[lock.clock]
# date-format = "%A, %-d %B"

[places]
# trash = true
# network = true

[removable]
# capacity-interval = 10
