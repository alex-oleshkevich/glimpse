# Glimpse default configuration.
#
# Installed once, automatically, to ~/.config/glimpse/config.toml (or
# $XDG_CONFIG_HOME/glimpse/config.toml) the first time Glimpse runs and finds
# no config file there. It is never overwritten after that, so edit it
# freely.
#
# Every setting below is commented out and shown at its current built-in
# default, except [wallpaper], which is active so a fresh install has a
# wallpaper on first launch. Uncomment and edit anything you want to change;
# delete a line to fall back to the built-in default again.
#
# Full reference: https://github.com/alex-oleshkevich/glimpse
# Panel and applet configuration: https://github.com/alex-oleshkevich/glimpse/blob/master/docs/configuration.md

# theme = "adwaita"
# theme_mode = "auto"          # auto | light | dark

[wallpaper]
path = "/usr/share/glimpse/wallpapers/city.jpg"
fit = "cover"
# color = "#101010"            # shown while the image loads, or if path is unset
# transition_ms = 800

# [backdrop]
# enabled = true                # blurred wallpaper behind the panel and popovers
                                 # (needs a niri layer-rule to also show in the
                                 # Overview; see docs/wallpaper.md)
# path = "..."                  # defaults to wallpaper.path when unset
# blur_radius = 24

# [location]
# provider = "geo_clue"         # only provider supported today

# [monitors]
# builtin_connector = "eDP-1"   # override built-in-display detection

# ---------------------------------------------------------------------------
# Panels
# ---------------------------------------------------------------------------
# One [[panels]] block per panel. Repeat the block for multiple panels
# (e.g. a second bar on another monitor). This is the built-in single-panel
# default:
#
# [[panels]]
# position = "top"               # top | bottom | left | right
# size = 36                      # panel thickness in px
# monitor = "eDP-1"              # pin to one output; unset = every output
# theme_mode = "dark"            # per-panel override of the top-level theme_mode
# left = ["pager", "mpris"]
# center = ["clock", "weather", "notifications", "privacy"]
# right = [
#   "next_event", "tray", "removable", "clipboard", "keyboard", "printing",
#   "bluetooth", "network", "display", "audio", "idle", "battery", "session",
# ]
#
# Use "..." inside a section to keep the built-in applets for that section
# and add your own around them, e.g. left = ["...", "screenshot"].
#
# Built-in applet names: audio, battery, bluetooth, brightness, clipboard,
# clock, command, exec, idle, keyboard, mpris, network, next_event,
# notifications, pager, privacy, printing, removable, session, tray, weather,
# window, workspace.

# ---------------------------------------------------------------------------
# Night light
# ---------------------------------------------------------------------------

# [night_light]
# schedule = "automatic"         # off | automatic | schedule
# temperature = 4200             # kelvin
# transition_minutes = 15
# start_time = "20:30"           # "HH:MM", only used when schedule = "schedule"
# end_time = "07:00"

# ---------------------------------------------------------------------------
# Idle policy
# ---------------------------------------------------------------------------
# Runs on logind idle. This is the built-in three-step ladder (monitors off,
# lock, suspend), with separate AC and battery timeouts:
#
# [idle]
# enabled = true
# respect_inhibitors = true
#
# [idle.profiles.ac]
# listeners = [
#   { timeout = 600, on_idle = "/usr/share/glimpse/scripts/monitors off", on_resume = "/usr/share/glimpse/scripts/monitors on" },
#   { timeout = 900, on_idle = "loginctl lock-session" },
#   { timeout = 3600, on_idle = "systemctl suspend" },
# ]
#
# [idle.profiles.battery]
# listeners = [
#   { timeout = 300, on_idle = "/usr/share/glimpse/scripts/monitors off", on_resume = "/usr/share/glimpse/scripts/monitors on" },
#   { timeout = 900, on_idle = "loginctl lock-session" },
#   { timeout = 1800, on_idle = "systemctl suspend" },
# ]

# ---------------------------------------------------------------------------
# Keyboard
# ---------------------------------------------------------------------------

# [keyboard]
# remember = "window"            # global | app | window

# ---------------------------------------------------------------------------
# Lock screen
# ---------------------------------------------------------------------------

# [lock]
# pam_service = "glimpse-lock"
# css_path = "themes/lock.css"
#
# [lock.background]
# path = "..."                   # defaults to the wallpaper config
# color = "#101010"
# fit = "cover"
# blur_radius = 0
# dim = 0.35                     # 0.0-1.0
#
# [lock.clock]
# enabled = true
# time_format = "%H:%M"
# date_format = "%A, %B %-d"
#
# [lock.controls]
# buttons = ["wifi", "input", "weather", "battery", "power"]

# ---------------------------------------------------------------------------
# Calendar
# ---------------------------------------------------------------------------
# Feeds the clock popover and the next_event applet. Empty by default; add
# one [[calendar.sources]] block per calendar. See docs/calendar.md.
#
# [calendar]
# poll_interval = 600            # seconds
#
# [[calendar.sources]]
# id = "personal"
# type = "ical"                  # ical | directory
# name = "Personal"
# uri = "https://calendar.google.com/calendar/ical/example/basic.ics"
# color = "#4285f4"

# ---------------------------------------------------------------------------
# Applet settings
# ---------------------------------------------------------------------------
# Configure any applet with [applets.<name>]. These are every built-in
# applet's fields at their default value; uncomment a block and change what
# you need.

# [applets.audio]
# show_icon = true
# show_muted_indicator = true
# label_format = ""
# tooltip_format = "{device} - {volume}%"
# scroll_step = 10
# max_volume = 100
# show_streams = true

# [applets.battery]
