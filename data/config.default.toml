#:schema /usr/share/glimpse/config.schema.json
# This is glimpse's default configuration — every setting, with the value it ships with.

[appearance]
theme = "adwaita"
theme-variant = ""
color-scheme = "auto"

[monitors]

[geolocation]
provider = "geoclue"

[night-light]
schedule = "automatic"
temperature = 4200
transition-minutes = 15

[idle]
enabled = true
respect-inhibitors = true

[[idle.profiles.ac.listeners]]
timeout = 600
on-idle = "/usr/share/glimpse/scripts/monitors off"
on-resume = "/usr/share/glimpse/scripts/monitors on"

[[idle.profiles.ac.listeners]]
timeout = 900
on-idle = "loginctl lock-session"
on-resume = ""

[[idle.profiles.ac.listeners]]
timeout = 3600
on-idle = "systemctl suspend"
on-resume = ""

[[idle.profiles.battery.listeners]]
timeout = 300
on-idle = "/usr/share/glimpse/scripts/monitors off"
on-resume = "/usr/share/glimpse/scripts/monitors on"

[[idle.profiles.battery.listeners]]
timeout = 900
on-idle = "loginctl lock-session"
on-resume = ""

[[idle.profiles.battery.listeners]]
timeout = 1800
on-idle = "systemctl suspend"
on-resume = ""

[power]
lock-before-sleep = true
lock-on-request = true

[keyboard]
remember = "window"

[keyboard.labels]

[calendar]
poll-interval = 600
sources = []

[wallpaper]
fit = "fill"
color = "#000000"
background = ""
background-dark = ""

[backdrop]
enabled = true
blur-radius = 24

[lock]
pam-service = "glimpse-lock"
background = ""
background-dark = ""
dim = 1.0
dim-dark = 1.0

[lock.clock]
enabled = true
time-format = "%H:%M"
date-format = "%A, %B %-d"

[lock.controls]
buttons = [
    "wifi",
    "input",
    "weather",
    "battery",
    "power",
]

[[panels]]
size = 36
position = "top"
left = [
    "pager",
    "mpris",
]
center = [
    "clock",
    "weather",
    "notifications",
    "privacy",
]
right = [
    "next-event",
    "tray",
    "removable",
    "clipboard",
    "keyboard",
    "printing",
    "bluetooth",
    "network",
    "display",
    "audio",
    "idle",
    "battery",
    "session",
]

[panels.margin]
left = 0
right = 0
top = 0
bottom = 0

[applets]
