# label_on_battery = ""
# label_on_ac = ""
# tooltip_on_battery = "{percentage}% {state}, {time_left}"
# tooltip_on_ac = "{percentage}% {state}"
# settings_command = ""

# [applets.bluetooth]
# label_format = ""
# tooltip_format = "{devices} connected devices"

# [applets.brightness]
# label_format = ""
# tooltip_format = "{source}: {percent}%"
