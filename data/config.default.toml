# [applets.exec]              # command is unset by default; example below
# command = ["/path/to/script"]
# restart_delay_ms = 1000        # clamped, minimum 50
# options = {}                   # arbitrary JSON passed to the child process
# env_forward = false
# env = {}
# work_dir = "..."

# [applets.keyboard]
