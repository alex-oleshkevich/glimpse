[panel]
refresh_ms = 1000
format = "{cpu} {ram} {swap}"

[panel.items.cpu]
icon = "computer-symbolic"
label = "CPU"

[panel.items.ram]
icon = "computer-symbolic"
label = "RAM"
warn_at = 90

[panel.items.swap]
icon = "drive-harddisk-symbolic"
label = "SWP"
warn_at = 80

[popover.sections]
network = true
gpu = true
disk = true
temps = true
uptime = true
load = true
memory = true
