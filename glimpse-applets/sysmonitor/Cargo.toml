[package]
name = "sysmonitor"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
async-trait = "0.1"
glimpse-sdk = { path = "../../sdk/sdk-rs" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
toml = "0.8"
