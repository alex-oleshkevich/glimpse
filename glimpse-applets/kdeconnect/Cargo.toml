[package]
name = "kdeconnect"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
glimpse-sdk = { path = "../../sdk/sdk-rs" }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
serde_json = "1"
