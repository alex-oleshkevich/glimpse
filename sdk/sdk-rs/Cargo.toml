[package]
name = "glimpse-sdk"
version = "0.1.2"
edition = "2024"
description = "Typed async framework for building Glimpse exec applets"
license = "MIT"
repository = "https://github.com/alex-oleshkevich/glimpse"
homepage = "https://alex-oleshkevich.github.io/glimpse/"
documentation = "https://alex-oleshkevich.github.io/glimpse/applets/exec-sdk"
readme = "README.md"
authors = ["Alex Oleshkevich <alex.oleshkevich@gmail.com>"]
keywords = ["glimpse", "applet", "panel", "desktop", "sdk"]
categories = ["api-bindings", "gui"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[workspace]
