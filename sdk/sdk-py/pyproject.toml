[build-system]
requires = ["uv_build>=0.5,<0.20"]
build-backend = "uv_build"

[project]
name = "glimpse-applet-sdk"
version = "0.2.0"
description = "Typed async framework for Glimpse exec applets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []
authors = [{ name = "Alex Oleshkevich", email = "alex.oleshkevich@gmail.com" }]
keywords = ["glimpse", "applet", "panel", "desktop", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://alex-oleshkevich.github.io/glimpse/"
Documentation = "https://alex-oleshkevich.github.io/glimpse/applets/exec-sdk"
Repository = "https://github.com/alex-oleshkevich/glimpse"
Issues = "https://github.com/alex-oleshkevich/glimpse/issues"

[tool.uv.build-backend]
module-name = "glimpse_sdk"
module-root = ""
