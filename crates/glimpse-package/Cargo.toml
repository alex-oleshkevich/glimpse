# auto-req (default) scans every asset under the RPM, so it should cover all bundled
# binaries, but these are listed explicitly too as a safety net against a partial scan.
[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
gtk4-layer-shell = "*"
geoclue2 = "*"
pulseaudio-libs = "*"
systemd-libs = "*"
ddcutil = "*"
pam = "*"

# Replaces the table above rather than merging into it. Those are Fedora names; openSUSE's differ for
# every linked library, which auto-req already requires by soname, so only names that match stay.
# openSUSE splits ddcutil's udev rule into its own package, and the rule is all glimpse wants.
[package.metadata.generate-rpm.variants.opensuse.requires]
geoclue2 = "*"
pam = "*"
ddcutil-i2c-udev-rules = "*"

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
