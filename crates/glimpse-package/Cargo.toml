[package]
name = "glimpse-package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Desktop shell suite for Wayland compositors"
license.workspace = true
publish = false

[package.metadata.deb]
name = "glimpse"
maintainer = "Alex Oleshkevich <alex.oleshkevich@gmail.com>"
copyright = "2026, Alex Oleshkevich <alex.oleshkevich@gmail.com>"
section = "gnome"
priority = "optional"
extended-description = """\
A desktop shell suite for Wayland compositors: a panel, a wallpaper renderer, and a lock."""

# $auto scans this crate's own linked libraries via dpkg-shlibdeps; the other binaries
# bundled into this .deb via `assets` link GTK4/libadwaita/gtk4-layer-shell, which $auto's scan
# may not cover, so those are listed explicitly rather than trusted to auto-detect. Nothing links
# libheif or PAM — `ldd` over every shipped binary finds neither, and no crate declares them —
# so neither is listed here.
depends = [
  "$auto",
  "libgtk-4-1",
  "libadwaita-1-0",
  "libgtk4-layer-shell0",
  "geoclue-2.0",
  "libpulse0",
  "libudev1",
]
assets = [
  ["target/release/glimpsectl", "usr/bin/", "755"],
  ["target/release/glimpse-panel", "usr/bin/", "755"],
  ["target/release/glimpse-lock", "usr/bin/", "755"],
  ["target/release/glimpse-wallpaper", "usr/bin/", "755"],
  ["target/release/glimpse-sunset", "usr/bin/", "755"],
  ["target/release/glimpse-notifications", "usr/bin/", "755"],
  ["target/release/glimpse-weather", "usr/bin/", "755"],
  ["target/release/glimpse-idle", "usr/bin/", "755"],
  ["../../data/config.default.toml", "usr/share/glimpse/", "644"],
  ["../../data/config.schema.json", "usr/share/glimpse/", "644"],
  ["../../data/language-codes.json", "usr/share/glimpse/", "644"],
  ["../../wallpapers/*", "usr/share/glimpse/wallpapers/", "644"],
  ["../../data/themes/adwaita/*.css", "usr/share/glimpse/themes/adwaita/", "644"],
  ["../../data/systemd/*.service", "usr/lib/systemd/user/", "644"],
  ["../../data/systemd/*.target", "usr/lib/systemd/user/", "644"],
  ["../../data/dbus-1/services/*.service", "usr/share/dbus-1/services/", "644"],
  ["../../data/portals/*.portal", "usr/share/xdg-desktop-portal/portals/", "644"],
  ["../../data/portals/*-portals.conf", "usr/share/xdg-desktop-portal/", "644"],
  ["../../data/geoclue/conf.d/glimpse.conf", "etc/geoclue/conf.d/", "644"],
  ["../../LICENSE", "usr/share/glimpse/", "644"],
  # One line per language, never a glob — see README, "Translation catalogs".
  ["../../target/locale/ru/LC_MESSAGES/glimpse.mo", "usr/share/locale/ru/LC_MESSAGES/", "644"],
]

# Marked as a conffile so dpkg preserves an edited allowlist across upgrades rather than
# overwriting it, which is the whole point of it living under /etc.
conf-files = ["/etc/geoclue/conf.d/glimpse.conf"]

# `cargo generate-rpm -p crates/glimpse-package` is run from the workspace root, so these `source` paths
# resolve there directly (unlike cargo-deb's crate-manifest-relative resolution above).
[package.metadata.generate-rpm]
name = "glimpse"
summary = "Desktop shell suite for Wayland compositors"
assets = [
  { source = "target/release/glimpsectl", dest = "/usr/bin/glimpsectl", mode = "755" },
  { source = "target/release/glimpse-panel", dest = "/usr/bin/glimpse-panel", mode = "755" },
  { source = "target/release/glimpse-lock", dest = "/usr/bin/glimpse-lock", mode = "755" },
  { source = "target/release/glimpse-wallpaper", dest = "/usr/bin/glimpse-wallpaper", mode = "755" },
  { source = "target/release/glimpse-sunset", dest = "/usr/bin/glimpse-sunset", mode = "755" },
  { source = "target/release/glimpse-notifications", dest = "/usr/bin/glimpse-notifications", mode = "755" },
  { source = "target/release/glimpse-weather", dest = "/usr/bin/glimpse-weather", mode = "755" },
  { source = "target/release/glimpse-idle", dest = "/usr/bin/glimpse-idle", mode = "755" },
  { source = "data/config.default.toml", dest = "/usr/share/glimpse/", mode = "644" },
  { source = "data/config.schema.json", dest = "/usr/share/glimpse/", mode = "644" },
  { source = "data/language-codes.json", dest = "/usr/share/glimpse/", mode = "644" },
  { source = "wallpapers/*", dest = "/usr/share/glimpse/wallpapers/", mode = "644" },
  { source = "data/themes/adwaita/*.css", dest = "/usr/share/glimpse/themes/adwaita/", mode = "644" },
  { source = "data/systemd/*.service", dest = "/usr/lib/systemd/user/", mode = "644" },
  { source = "data/systemd/*.target", dest = "/usr/lib/systemd/user/", mode = "644" },
  { source = "data/dbus-1/services/*.service", dest = "/usr/share/dbus-1/services/", mode = "644" },
  { source = "data/portals/*.portal", dest = "/usr/share/xdg-desktop-portal/portals/", mode = "644" },
  { source = "data/portals/*-portals.conf", dest = "/usr/share/xdg-desktop-portal/", mode = "644" },
  { source = "data/geoclue/conf.d/glimpse.conf", dest = "/etc/geoclue/conf.d/glimpse.conf", mode = "644", config = true },
  { source = "LICENSE", dest = "/usr/share/glimpse/", mode = "644" },
  # One line per language here too, so the two lists stay comparable — see README.
  { source = "target/locale/ru/LC_MESSAGES/glimpse.mo", dest = "/usr/share/locale/ru/LC_MESSAGES/glimpse.mo", mode = "644" },
]

# auto-req (default) scans every asset under the RPM, so it should cover all bundled
# binaries, but these are listed explicitly too as a safety net against a partial scan.
[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
gtk4-layer-shell = "*"
geoclue2 = "*"
pulseaudio-libs = "*"
systemd-libs = "*"

[dev-dependencies]
toml.workspace = true
