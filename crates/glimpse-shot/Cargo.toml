glimpse-dbus.workspace = true
glimpse-utils.workspace = true
glimpse-wayland.workspace = true
glimpse-widgets.workspace = true
gtk-mcp-agent = { workspace = true, optional = true }
gtk4.workspace = true
gtk4-layer-shell.workspace = true
libc.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
shadow-rs.workspace = true
thiserror.workspace = true
