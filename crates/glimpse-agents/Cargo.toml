[package]
name = "glimpse-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
gtk-mcp = ["dep:gtk-mcp-agent"]

[dependencies]
adw.workspace = true
anyhow.workspace = true
clap.workspace = true
colorchoice-clap.workspace = true
futures-util.workspace = true
gettext-rs.workspace = true
gio.workspace = true
glib.workspace = true
glimpse-config.workspace = true
glimpse-dbus.workspace = true
glimpse-utils.workspace = true
glimpse-widgets.workspace = true
gtk-mcp-agent = { workspace = true, optional = true }
gtk4.workspace = true
gtk4-layer-shell.workspace = true
relm4.workspace = true
shadow-rs.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
glimpse-dbus = { workspace = true, features = ["testing"] }
glimpse-widgets = { workspace = true, features = ["preview"] }
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "agents-preview"
path = "examples/preview.rs"

[build-dependencies]
glib-build-tools.workspace = true
shadow-rs.workspace = true
