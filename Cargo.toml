[workspace]
resolver = "3"
members = [
    "glimpse-plugins/apps",
    "glimpse-plugins/calculator",
    "glimpse-sdk",
    "glimpsed",
]

[workspace.dependencies]
glimpse-sdk = { path = "glimpse-sdk" }
tokio = { version = "1.46.1", features = ["full"] }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140" }
tokio-stream = { version = "0.1.17", features = ["io-util"] }
freedesktop-desktop-entry = "0.7.19"
freedesktop-icons = "0.4.0"
anyhow = "1.0.98"
dirs = "6.0.0"
tokio-test = "0.4"                                                     # Latest available async testing utilities
tempfile = "3.12"                                                      # Latest temporary file handling
assert_matches = "1.5"                                                 # Pattern matching assertions
serial_test = "3.1"                                                    # Test serialization (latest)
mockall = "0.13"                                                       # Advanced mocking (latest)
proptest = "1.5"                                                       # Property-based testing (latest)
criterion = "0.7"                                                      # Benchmarking (latest available)
tracing-test = "0.2"                                                   # Tracing capture for testing (latest available)
futures = "0.3"
nix = { version = "0.29", features = ["signal", "process"] }
cargo-llvm-cov = "0.6"
async-trait = "0.1.89"
gio = { version = "0.21.2" }
