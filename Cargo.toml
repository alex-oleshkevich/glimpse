[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.93"
license = "BSD-3-Clause"

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["gtk_v4_22", "v1_9"] }
ammonia = "4"
anstream = "1"
anstyle = "1.0.14"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tzf-rs = { version = "1.3.7", default-features = false, features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
colorchoice-clap = "1.0.1"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
# Pinned to the 0.2 series, not the newer 0.3: ddc-i2c 0.2.2 depends on ddc ^0.2, and the two
# major versions are distinct types, so a bare "0.3" here would leave I2cDeviceDdc implementing a
# Ddc trait this crate never imports.
ddc = "0.2.2"
ddc-i2c = { version = "0.2.2", default-features = false, features = ["i2c-linux"] }
dirs = "6"
futures-util = { version = "0.3", features = ["sink"] }
gettext-rs = "0.8.0"
gio = "0.22"
gio-unix = "0.22"
glib = { version = "0.22", features = ["v2_68"] }
glib-build-tools = "0.22"
glimpse-compositors = { path = "crates/glimpse-compositors" }
glimpse-config = { path = "crates/glimpse-config" }
glimpse-dbus = { path = "crates/glimpse-dbus" }
glimpse-services = { path = "crates/glimpse-services" }
glimpse-utils = { path = "crates/glimpse-utils" }
glimpse-widgets = { path = "crates/glimpse-widgets" }
gtk4 = { package = "gtk4", version = "0.11", features = ["v4_22"] }
gtk4-layer-shell = "0.8"
gtk4-session-lock = { version = "0.4", features = ["v1_2"] }
icalendar = { version = "0.17.13", features = ["recurrence"] }
ipp = { version = "7.0.0", default-features = false, features = ["async-client-rustls"] }
iso8601 = "0.6.5"
libc = "0.2.189"
libpulse-binding = "2.30.1"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
notify = "8.2"
owo-colors = "4"
palette = { version = "0.7.7", default-features = false, features = ["std"] }
pam-client2 = { version = "0.5.5", default-features = false }
pipewire = "0.10.1"
png = "0.18.1"
regex = "1"
relm4 = { version = "0.11", features = ["gnome_50", "libadwaita"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
reverse_geocoder = "4.1.1"
rrule = "0.14"
rustix = { version = "1.1.4", features = ["event", "fs"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shadow-rs = "0.33.0"
sunrise = "3.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-udev = "0.10.0"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
udev = { version = "0.9.3", features = ["send"] }
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.12", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wl-clipboard-rs = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
lto = "thin"

[profile.profiling]
inherits = "release"
strip = false
debug = true
