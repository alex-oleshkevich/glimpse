[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.93"
license = "BSD-3-Clause"

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["gtk_v4_22", "v1_9"] }
ammonia = "4"
anstream = "1"
anstyle = "1.0.14"
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
colorchoice-clap = "1.0.1"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
css-color = "0.2"
dirs = "6"
futures-util = { version = "0.3", features = ["sink"] }
gio = "0.22"
gio-unix = "0.22"
glib = "0.22"
glib-build-tools = "0.22"
glimpse-config = { path = "crates/glimpse-config" }
glimpse-contracts = { path = "crates/glimpse-contracts" }
glimpse-dbus = { path = "crates/glimpse-dbus" }
glimpse-ipc = { path = "crates/glimpse-ipc" }
glimpse-services = { path = "crates/glimpse-services" }
glimpse-utils = { path = "crates/glimpse-utils" }
gtk4 = { package = "gtk4", version = "0.11", features = ["v4_22"] }
gtk4-layer-shell = "0.8"
gtk4-session-lock = { version = "0.4", features = ["v1_1"] }
notify = "8.2"
owo-colors = "4"
regex = "1"
relm4 = { version = "0.11", features = ["gnome_50", "libadwaita"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
rrule = "0.14"
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shadow-rs = "0.33.0"
sunrise = "3.0"
system-tray = "0.8.5"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
wl-clipboard-rs = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
lto = "thin"
