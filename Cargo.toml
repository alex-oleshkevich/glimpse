[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["gtk_v4_22", "v1_9"] }
ammonia = "4"
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
chrono-tz = "0.10"
css-color = "0.2"
dirs = "6"
futures-util = "0.3"
gio = "0.22"
gio-unix = "0.22"
glib = "0.22"
glib-build-tools = "0.22"
gtk4 = { package = "gtk4", version = "0.11", features = ["v4_22"] }
gtk4-layer-shell = "0.8"
gtk4-session-lock = { version = "0.4", features = ["v1_1"] }
notify = "8.2"
notify-debouncer-full = "0.7"
regex = "1"
relm4 = { version = "0.11", features = ["gnome_50", "libadwaita"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sunrise = "3.0"
system-tray = "0.8.5"
tokio = { version = "1", features = ["io-util", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
wl-clipboard-rs = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
lto = "thin"
