[package]
name = "glimpse-applets-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI for scaffolding and developing Glimpse exec applets"
license = "MIT"
repository = "https://github.com/alex-oleshkevich/glimpse"
homepage = "https://alex-oleshkevich.github.io/glimpse/"
documentation = "https://alex-oleshkevich.github.io/glimpse/applets/exec-sdk"
readme = "README.md"
authors = ["Alex Oleshkevich <alex.oleshkevich@gmail.com>"]
keywords = ["glimpse", "applet", "panel", "scaffold", "dev"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "glimpse-applet"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
notify.workspace = true
notify-debouncer-full.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
which = "8"
